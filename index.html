
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ulangan.harianPpkn</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#f7d6dc;
  font-family:'Fredoka',sans-serif;
  overflow-x:hidden;
  overflow-y:auto;
}

.page{
  display:none;
  width:100%;
  min-height:100vh;
  justify-content:center;
  align-items:center;
  padding:20px;
  text-align:center;
}

.page.active{
  display:flex;
}

.card{
  max-width:420px;
  width:100%;
}

.title{
  font-family:'Baloo 2',cursive;
  color:#a62d58;
  font-size:2rem;
  margin-bottom:15px;
  line-height:1.3;
}

.text{
  color:#b15f7b;
  line-height:1.8;
  margin-bottom:25px;
}

.btn{
  background:#980038;
  color:white;
  border:none;
  padding:14px 35px;
  border-radius:999px;
  cursor:pointer;
  font-family:'Fredoka',sans-serif;
  font-weight:600;
  transition:.3s;
}

.btn:hover{
  transform:scale(1.05);
}

.calendar-img{
  width:260px;
  display:block;
  margin:0 auto 20px;
  animation:float 3s infinite ease-in-out;
}

.character-img{
  width:180px;
  display:block;
  margin:0 auto 20px;
  animation:float 3s infinite ease-in-out;
}

.envelope-img{
  width:220px;
  display:block;
  margin:0 auto 20px;
  animation:float 3s infinite ease-in-out;
}

/* =================================
   GALLERY FOTO PORTRAIT
================================= */

.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-bottom:20px;
}

.gallery img{
  width:100%;
  aspect-ratio:3 / 4;
  height:auto;
  object-fit:cover;
  border-radius:20px;
  display:block;
}

/* =================================
   SURAT ULANG TAHUN
================================= */

.birthday-letter{
  width:100%;
  max-width:700px;
  padding:20px;
  max-height:80vh;
  overflow-y:auto;
}

.final-title{
  font-family:'Baloo 2',cursive;
  font-size:2rem;
  line-height:1.4;
  color:#a62d58;
  margin-bottom:30px;
}

.letter-content{
  border-left:4px solid #d67c9d;
  padding-left:20px;
  text-align:left;
}

#typing-text{
  white-space:pre-line;
  font-size:1rem;
  line-height:2;
  color:#8c4a65;
}

.cursor{
  animation:blink .8s infinite;
}

/* =================================
   BUNGA / LOVE BERTERBANGAN
================================= */

.hearts{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  overflow:hidden;
  z-index:10;
}

.heart{
  position:absolute;
  animation:fall linear forwards;
}

/* =================================
   ANIMASI
================================= */

@keyframes float{
  0%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-10px);
  }

  100%{
    transform:translateY(0);
  }
}

@keyframes fall{
  from{
    transform:translateY(-50px);
    opacity:1;
  }

  to{
    transform:translateY(100vh);
    opacity:0;
  }
}

@keyframes blink{
  50%{
    opacity:0;
  }
}

/* =================================
   RESPONSIVE HP
================================= */

@media(max-width:480px){

  .page{
    padding:15px;
  }

  .calendar-img{
    width:240px;
  }

  .character-img{
    width:170px;
  }

  .envelope-img{
    width:210px;
  }

  .gallery{
    gap:10px;
  }

  .gallery img{
    border-radius:16px;
  }

  .title{
    font-size:1.8rem;
  }

  .final-title{
    font-size:1.8rem;
  }

  #typing-text{
    font-size:.95rem;
  }

}

</style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="musik.mp3" type="audio/mpeg">
</audio>

<div class="hearts"></div>

<!-- PAGE 1 -->
<div class="page active">
  <div class="card">

    <img src="box.gif" class="calendar-img">

    <button class="btn" onclick="nextPage(); playMusic()">
      open <3
    </button>

  </div>
</div>

<!-- PAGE 2 -->
<div class="page">
  <div class="card">

    <img src="kalender.png" class="calendar-img">

    <h1 class="title">
      habedee Nandha!!
    </h1>

    <p class="text">
      there's more waiting... click to find out
    </p>

    <button class="btn" onclick="nextPage()">
      tap <3
    </button>

  </div>
</div>

<!-- PAGE 3 -->
<div class="page">
  <div class="card">

    <img src="icon4.gif" class="character-img">

    <p class="text">
      tengkyu setiap bantuannyaaa
    </p>

    <button class="btn" onclick="nextPage()">
      ♡
    </button>

  </div>
</div>

<!-- PAGE 4 -->
<div class="page">
  <div class="card">

    <img src="icon5.gif" class="character-img">

    <h1 class="title">
      2920 hari!!
    </h1>

    <p class="text">
      8 tahun lohyaa kita temenannn
    </p>

    <button class="btn" onclick="nextPage()">
      tap <3
    </button>

  </div>
</div>

<!-- PAGE 5 - FOTO PORTRAIT -->
<div class="page">
  <div class="card">

    <div class="gallery">

      <img src="foto1.jpg" alt="Foto 1">

      <img src="foto2.jpg" alt="Foto 2">

      <img src="foto3.jpg" alt="Foto 3">

      <img src="foto4.jpg" alt="Foto 4">

    </div>

    <button class="btn" onclick="nextPage()">
      ♡
    </button>

  </div>
</div>

<!-- PAGE 6 -->
<div class="page">
  <div class="card">

    <img src="amplop.gif" class="envelope-img">

    <p class="text">
      there's something I want to tell you.
    </p>

    <button class="btn" onclick="nextPage()">
      open
    </button>

  </div>
</div>

<!-- PAGE 7 -->
<div class="page">

  <div class="birthday-letter">

    <h1 class="final-title">
      🎀 HAPPYY BIRTHDAY 🎀 <br>
      ₍˶ᵔ ᵕ ᵔ˶₎♡
    </h1>

    <div class="letter-content">
      <p id="typing-text"></p>
    </div>

    <br>

    <button class="btn" onclick="nextPage()">
      ♡
    </button>

  </div>

</div>

<!-- PAGE 8 -->
<div class="page">
  <div class="card">

    <img src="icon3.gif" class="character-img">

    <p class="text">
      ini untuk muu :)
    </p>

  </div>
</div>

<script>

const birthdayMessage = `Happy birthday Ananda😳🥳

Semoga panjang umurrr, sehat selaluuu, selalu di mudahkan rezekinyaAaq,,,,,

Bistyy alumni 1x0=1
i really seneng punya temen baik kaya kamu, baik, penyabarrrr, tidak sombonghh, pengertiannn, bercukur banget aku lohya🤭

Mau main bareng lagi pake Supra jalan-jalan ke kapling, tapi tunggu i jadi ony-ony khoreaaa👿😈

Cumha bisa segini lohya, i ga punya ide banyak kaya u yang spek otak meta Ai

Pokoknya makhasi udah jadi bisty akhuu🫂`;

let typingStarted = false;

function startTyping(){

  if(typingStarted) return;

  typingStarted = true;

  const target =
    document.getElementById("typing-text");

  let i = 0;

  function type(){

    if(i < birthdayMessage.length){

      target.innerHTML =
        birthdayMessage.substring(0,i+1) +
        '<span class="cursor">|</span>';

      i++;

      setTimeout(type,20);

    }else{

      target.innerHTML =
        birthdayMessage;

    }

  }

  type();

}

let current = 0;

const pages = document.querySelectorAll(".page");

function nextPage(){

  pages[current].classList.remove("active");

  current++;

  if(current >= pages.length){
    current = pages.length - 1;
  }

  pages[current].classList.add("active");

  if(current === 6){
    setTimeout(startTyping,500);
  }

}

const emojis = ["💗","🎀","🌹"];

setInterval(()=>{

  const heart = document.createElement("div");

  heart.className = "heart";

  heart.innerHTML =
    emojis[Math.floor(Math.random()*emojis.length)];

  heart.style.left =
    Math.random()*100 + "vw";

  heart.style.fontSize =
    (15 + Math.random()*20) + "px";

  heart.style.animationDuration =
    (4 + Math.random()*4) + "s";

  document
    .querySelector(".hearts")
    .appendChild(heart);

  setTimeout(()=>{
    heart.remove();
  },8000);

},300);

const bgMusic = document.getElementById("bgMusic");

function playMusic(){

  bgMusic.volume = 0.5;

  bgMusic.play().catch(()=>{
    console.log("Musik belum bisa diputar.");
  });

}

</script>

</body>
</html>
